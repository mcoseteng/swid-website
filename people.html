<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>People | Stanford Women in Design</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: "Instrument Serif";
      src: url("brand_assets/Instrument_Serif/InstrumentSerif-Regular.ttf") format("truetype");
      font-display: swap;
    }
    @font-face {
      font-family: "Instrument Serif";
      src: url("brand_assets/Instrument_Serif/InstrumentSerif-Italic.ttf") format("truetype");
      font-style: italic;
      font-display: swap;
    }

    :root {
      --swid-blue: #1f16bf;
      --swid-cream: #f0ebd6;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);

      /* Chrome tokens */
      --edge: 16px;          /* page gutter */
      --bar-y: 34px;         /* vertical centre of the top bar */
      --nav-logo: 50px;      /* logo width in the top bar */
      --ui-font: "Helvetica Neue", Helvetica, Arial, sans-serif;
      --ui-size: 11px;
      --display-size: clamp(30px, 3.6vw, 52px);   /* hero name + section headings */
      --body-size: calc(var(--ui-size) + 2px);     /* About + section body copy */
    }
    @media (max-width: 399px) {
      :root { --nav-logo: 42px; --ui-size: 10px; }
    }
    @media (min-width: 768px) {
      :root { --edge: 20px; --nav-logo: 73px; --ui-size: 13px; }
    }

    html { scroll-behavior: auto; }
    body {
      margin: 0;
      background: var(--swid-blue);
      color: var(--swid-cream);
    }

    /* ---------- Logo (top left of the bar) ---------- */
    .logo-track {
      position: fixed;
      top: var(--bar-y);
      left: var(--edge);
      z-index: 71;
      width: var(--nav-logo);
    }
    .logo {
      position: relative;
      display: block;
      aspect-ratio: 2542 / 886;
      transform: translateY(-50%) translateY(8px) scale(0.96);
      opacity: 0;
      animation: logo-in 500ms var(--spring) 200ms forwards;
    }
    .logo img {
      display: block;
      width: 100%;
      height: 100%;
      user-select: none;
      -webkit-user-drag: none;
    }
    .logo__star {
      position: absolute;
      left: 78.206%;
      top: 22.291%;
      width: 19.355%;
      aspect-ratio: 1;
    }
    .logo__star img { width: 100%; height: 100%; }
    body.is-open .logo-track { pointer-events: auto; }

    @keyframes logo-in   { to { transform: translateY(-50%); opacity: 1; } }

    /* ---------- Chrome (top bar + follow us) ---------- */
    .chrome {
      font-family: var(--ui-font);
      font-size: var(--ui-size);
      line-height: 1.35;
      letter-spacing: 0.01em;
      opacity: 0;
      transition: opacity 500ms ease 150ms;
    }
    body.is-open .chrome { opacity: 1; }

    .topbar {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 70;
      height: calc(var(--bar-y) * 2);
      padding: 0 var(--edge);
      display: flex;
      align-items: center;
      justify-content: flex-end;   /* logo sits on the left as its own fixed layer */
    }
    .topbar__nav { display: none; gap: 36px; }
    @media (min-width: 768px) {
      .topbar__nav { display: flex; }
      .topbar__menu { display: none; }
    }

    .follow {
      position: fixed;
      left: var(--edge);
      bottom: 20px;
      z-index: 70;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ui-link {
      color: inherit;
      text-decoration: none;
      border-radius: 2px;
      transition: opacity 200ms ease, transform 200ms var(--spring);
    }
    .ui-link:hover { opacity: 0.6; }
    .ui-link:active { opacity: 0.4; transform: translateY(1px); }
    .ui-link:focus-visible { outline: 1px solid var(--swid-cream); outline-offset: 4px; }
    .ui-link[aria-current="page"] { opacity: 1; }

    .topbar__menu {
      background: none;
      border: 0;
      padding: 0;
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      color: inherit;
      cursor: pointer;
    }

    /* Mobile menu sheet */
    .sheet {
      position: fixed;
      inset: calc(var(--bar-y) * 2) 0 auto 0;
      z-index: 69;
      padding: 8px var(--edge) 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: var(--swid-blue);
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity 250ms ease, transform 350ms var(--spring);
    }
    body.is-open .sheet:not(.is-open) { opacity: 0; }
    .sheet.is-open { opacity: 1; transform: none; pointer-events: auto; }
    @media (min-width: 768px) { .sheet { display: none; } }

    /* ---------- People: designer playgrounds ---------- */
    :root { --page-x: 24px; --rule: 3px solid var(--swid-cream); }
    @media (min-width: 768px) { :root { --page-x: 64px; } main { padding-top: calc(var(--bar-y) * 2 + 72px); } }
    .topbar { background: var(--swid-blue); }   /* page scrolls under the bar, so give it a solid fill */
    main { padding: calc(var(--bar-y) * 2 + 40px) var(--page-x) 120px; }   /* bottom room keeps fixed "Follow us" off the last row */

    .people__title {
      margin: 0 0 20px;
      text-align: center;
      font: 400 clamp(26px, 2.7vw, 48px)/1.15 "Instrument Serif", Georgia, serif;
      letter-spacing: -0.01em;
      color: #ffffff;
    }
    .people__grid {
      display: grid;
      grid-template-columns: minmax(0, 560px);
      justify-content: center;
      gap: 24px;
    }
    @media (min-width: 768px) {
      .people__grid { grid-template-columns: repeat(2, minmax(0, 39.3vw)); gap: 3.3vw; }   /* 523px boxes, 44px apart at 1330 */
    }

    /* Each playground is a framed board; the collage is placed in % so it scales with the board */
    .playground {
      position: relative;
      display: block;
      aspect-ratio: 523 / 471;
      border: var(--rule);
      color: inherit;
      container-type: inline-size;
      outline: none;
    }
    .playground:focus-visible { box-shadow: 0 0 0 3px var(--swid-blue), 0 0 0 6px var(--swid-cream); }

    .pg-piece {
      position: absolute;
      margin: 0;
      transition: transform 500ms var(--spring);
      box-shadow:
        0 1px 2px rgb(8 4 70 / 0.18),
        0 6px 14px -4px rgb(8 4 70 / 0.32),
        0 18px 34px -12px rgb(8 4 70 / 0.38);
    }
    .pg-piece img { display: block; width: 100%; height: auto; }
    /* back to front: poster and nametag tucked behind, Treeats under the name card */
    .pg-poster  { left: 71%;   top: 4%;    width: 23%;   rotate: 7deg;  z-index: 1; }
    .pg-thrive  { left: 59%;   top: 65%;   width: 36%;   rotate: 5deg;  z-index: 3; }
    .pg-shot    { left: 42.8%; top: 33%;   width: 48%;   rotate: -5deg; z-index: 2; }
    .pg-nametag { left: 2.5%;  top: 45%;   width: 14%;   rotate: -10deg; z-index: 1; }
    .pg-card    { left: 11%;   top: 11.5%; width: 56%;   rotate: 0deg;  z-index: 4; box-shadow: none; filter: drop-shadow(0 8px 14px rgb(8 4 70 / 0.38)); }
    /* pieces nudge apart a little on hover, like moving things on a desk */
    .playground:hover .pg-card,    .playground:focus-visible .pg-card    { transform: translate(-1.5%, -3%); }
    .playground:hover .pg-shot,    .playground:focus-visible .pg-shot    { transform: translate(3%, -2%); }
    .playground:hover .pg-poster,  .playground:focus-visible .pg-poster  { transform: translate(5%, -4%) rotate(2deg); }
    .playground:hover .pg-thrive,  .playground:focus-visible .pg-thrive  { transform: translate(4%, 3%) rotate(2deg); }
    .playground:hover .pg-nametag, .playground:focus-visible .pg-nametag { transform: translate(-6%, 3%) rotate(-3deg); }



    /* ---------- Playground opening: the box's frame and blue spread together to fill the page under the top bar ---------- */
    .pg-expand { position: fixed; inset: calc(var(--bar-y) * 2) 0 0 0; z-index: 65; pointer-events: none; visibility: hidden; }
    .pg-expand.is-active { visibility: visible; pointer-events: auto; }
    .pg-expand__fill,
    .pg-expand__line { position: absolute; will-change: transform; }
    .pg-expand__fill { inset: 0; background: var(--swid-blue); transform-origin: 0 0; }
    .pg-expand__line { background: var(--swid-cream); }
    .pg-expand__line--t { top: 0;    left: 0;  width: 100%; height: 3px;  transform-origin: 0 0; }
    .pg-expand__line--b { bottom: 0; left: 0;  width: 100%; height: 3px;  transform-origin: 0 100%; }
    .pg-expand__line--l { top: 0;    left: 0;  width: 3px;  height: 100%; transform-origin: 0 0; }
    .pg-expand__line--r { top: 0;    right: 0; width: 3px;  height: 100%; transform-origin: 100% 0; }
    /* frame and blue move as one, opening and closing */
    .pg-expand.is-open .pg-expand__fill,
    .pg-expand.is-open .pg-expand__line,
    .pg-expand.is-closing .pg-expand__fill,
    .pg-expand.is-closing .pg-expand__line { transition: transform 750ms cubic-bezier(0.65, 0, 0.35, 1); }
    /* the opened box rides above the blue so its collage stays in view; its own border hands over to the moving frame */
    .playground.is-expanded { z-index: 66; border-color: transparent; }
    .pg-expand__close {
      position: absolute;
      top: 20px;
      right: calc(var(--edge) + 4px);
      padding: 0;
      background: none;
      border: 0;
      font: inherit;
      color: var(--swid-cream);
      cursor: pointer;
      opacity: 0;
      transition: opacity 250ms ease, transform 200ms var(--spring);
    }
    .pg-expand.is-open .pg-expand__close { opacity: 1; transition-delay: 650ms, 0s; }
    .pg-expand__close:hover { opacity: 0.6 !important; }
    .pg-expand__close:active { transform: translateY(1px); }
    .pg-expand__close:focus-visible { outline: 1px solid var(--swid-cream); outline-offset: 4px; }
    body.has-expand { overflow: hidden; }

    @media (prefers-reduced-motion: reduce) {
      .logo { animation: none; opacity: 1; transform: translateY(-50%); }
      .chrome, .sheet, .ui-link, .playground, .pg-piece, .pg-expand *, .pg-expand__close { transition: none !important; }
    }
    /* ---------- Footer: three columns of large links on cream ---------- */
    .site-footer {
      --footer-x: max(var(--edge), 1.8vw);
      position: relative;
      z-index: 1;
      padding: 40px var(--footer-x) 64px;
      background: var(--swid-cream);
      color: var(--swid-blue);
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 56px;
    }
    @media (min-width: 768px) {
      .site-footer { grid-template-columns: 34vw 34vw 1fr; padding-bottom: 72px; }
    }
    .site-footer__label {
      margin: 0 0 clamp(28px, 3.1vw, 62px);
      font: 400 var(--ui-size)/1.35 var(--ui-font);
      letter-spacing: 0.01em;
      opacity: 0.55;
    }
    .site-footer__list { margin: 0; padding: 0; list-style: none; }
    .site-footer__link {
      display: inline-block;
      font: 400 clamp(32px, 3vw, 60px)/1.42 "Inter", var(--ui-font);
      letter-spacing: -0.03em;
      color: inherit;
      text-decoration: none;
      border-radius: 2px;
      transition: opacity 200ms ease, transform 300ms var(--spring);
    }
    .site-footer__link:hover { opacity: 0.6; transform: translateX(4px); }
    .site-footer__link:active { opacity: 0.4; transform: translateX(4px) translateY(1px); }
    .site-footer__link:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    .site-footer__mail { overflow-wrap: anywhere; }
    /* white "Follow us" would vanish on cream, so it steps aside while the footer is on screen */
    body.is-open .follow.is-hidden { opacity: 0; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) { .site-footer__link { transition: none; } }
  </style>
</head>
<body class="is-open">
  <!-- Logo: top left of the bar -->
  <div class="logo-track" id="logoTrack">
    <a class="logo ui-link" href="index.html" aria-label="Stanford Women in Design, home">
      <img src="brand_assets/swid-wordmark.png" alt="" />
      <span class="logo__star"><img src="brand_assets/swid-star.png" alt="" /></span>
    </a>
  </div>

  <header class="topbar chrome">
    <nav class="topbar__nav" aria-label="Primary">
      <a class="ui-link" href="index.html#about">About</a>
      <a class="ui-link" href="events.html">Events</a>

    </nav>
    <button class="topbar__menu ui-link" id="menuBtn" aria-expanded="false" aria-controls="sheet">Menu</button>
  </header>

  <nav class="sheet chrome" id="sheet" aria-label="Primary mobile">
    <a class="ui-link" href="index.html#about">About</a>
    <a class="ui-link" href="events.html">Events</a>
    <a class="ui-link" href="people.html" aria-current="page">People</a>
    <a class="ui-link" href="index.html#get-involved">Get Involved</a>
  </nav>

  <div class="follow chrome">
    <span>Follow us</span>
    <a class="ui-link" href="https://www.instagram.com/swid.stanford/" target="_blank" rel="noopener noreferrer" aria-label="SWID on Instagram">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="display:block">
        <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" />
        <circle cx="12" cy="12" r="4.25" />
        <circle cx="17.6" cy="6.4" r="1.1" fill="currentColor" stroke="none" />
      </svg>

  </div>

  <main>
    <h1 class="people__title">Click on each designer’s playground to get to know them better</h1>
    <div class="people__grid">
      <!-- TODO: point each playground at that designer's page -->
      <a class="playground" href="#" data-expand aria-label="Taylor Torres, president, design ’27: open playground">
        <figure class="pg-piece pg-poster" aria-hidden="true"><img src="brand_assets/taylor/web/swid-week-poster.jpg" alt="" /></figure>
        <figure class="pg-piece pg-thrive" aria-hidden="true"><img src="brand_assets/taylor/web/thrive.jpg" alt="" /></figure>
        <figure class="pg-piece pg-shot" aria-hidden="true"><img src="brand_assets/taylor/web/treeats.jpg" alt="" /></figure>
        <figure class="pg-piece pg-nametag" aria-hidden="true"><img src="brand_assets/taylor/web/designathon-nametag.jpg" alt="" /></figure>
        <figure class="pg-piece pg-card" aria-hidden="true"><img src="brand_assets/taylor/web/title-card.png" alt="" /></figure>
      </a>
      <a class="playground" href="#" aria-label="Designer playground, coming soon"></a>
    </div>
  </main>

  <!-- Full-screen view a playground opens into -->
  <div class="pg-expand chrome" id="pgExpand" role="dialog" aria-modal="true" aria-label="Taylor Torres’s playground" aria-hidden="true">
    <div class="pg-expand__fill"></div>
    <span class="pg-expand__line pg-expand__line--t"></span>
    <span class="pg-expand__line pg-expand__line--b"></span>
    <span class="pg-expand__line pg-expand__line--l"></span>
    <span class="pg-expand__line pg-expand__line--r"></span>
    <button class="pg-expand__close" id="pgExpandClose">Close</button>
  </div>
  <footer class="site-footer" id="siteFooter">
    <nav aria-labelledby="footPages">
      <p class="site-footer__label" id="footPages">( Pages )</p>
      <ul class="site-footer__list">
        <li><a class="site-footer__link" href="index.html#about">About</a></li>
        <li><a class="site-footer__link" href="events.html">Events</a></li>
        <li><a class="site-footer__link" href="index.html#people">People</a></li>
        <li><a class="site-footer__link" href="index.html#get-involved">Get Involved</a></li>

    </nav>
    <div>
      <p class="site-footer__label">( Socials )</p>
      <ul class="site-footer__list">
        <li><a class="site-footer__link" href="https://www.instagram.com/swid.stanford/" target="_blank" rel="noopener noreferrer">Instagram</a></li>
        <li><a class="site-footer__link" href="#" target="_blank" rel="noopener noreferrer">Join our mailing list</a></li><!-- TODO: add the mailing list sign-up URL -->
      </ul>

    <div>
      <p class="site-footer__label">( Contact )</p>
      <a class="site-footer__link site-footer__mail" href="mailto:swid@stanford.edu">swid@stanford.edu</a><!-- TODO: confirm the club email -->
    </div>
  </footer>
  <script>
    (() => {
      const footer = document.getElementById('siteFooter');
      const follow = document.querySelector('.follow');
      if (!follow || !('IntersectionObserver' in window)) return;
      new IntersectionObserver(([e]) => follow.classList.toggle('is-hidden', e.isIntersecting)).observe(footer);
    })();
  </script>
  <script>
    (() => {
      /* ----- Mobile menu ----- */
      const menuBtn = document.getElementById('menuBtn');
      const sheet = document.getElementById('sheet');
      const setMenu = (open) => {
        sheet.classList.toggle('is-open', open);
        menuBtn.setAttribute('aria-expanded', open);
        menuBtn.textContent = open ? 'Close' : 'Menu';
      };
      menuBtn.addEventListener('click', () => setMenu(!sheet.classList.contains('is-open')));
      sheet.addEventListener('click', (e) => { if (e.target.closest('a')) setMenu(false); });

      /* ----- Playground opening ----- */
      const expand = document.getElementById('pgExpand');
      const closeBtn = document.getElementById('pgExpandClose');
      const parts = {
        fill: expand.querySelector('.pg-expand__fill'),
        t: expand.querySelector('.pg-expand__line--t'),
        b: expand.querySelector('.pg-expand__line--b'),
        l: expand.querySelector('.pg-expand__line--l'),
        r: expand.querySelector('.pg-expand__line--r'),
      };
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let opener = null, timer = 0;

      // Transforms that lay the full-screen layers exactly over the box's border
      function collapsed(box) {
        const o = expand.getBoundingClientRect();   // the area under the top bar
        const b = box.getBoundingClientRect();
        const x = b.left - o.left, y = b.top - o.top;
        const sx = b.width / o.width, sy = b.height / o.height;
        return {
          fill: `translate(${x}px, ${y}px) scale(${sx}, ${sy})`,
          t: `translate(${x}px, ${y}px) scaleX(${sx})`,
          b: `translate(${x}px, ${b.bottom - o.bottom}px) scaleX(${sx})`,
          l: `translate(${x}px, ${y}px) scaleY(${sy})`,
          r: `translate(${b.right - o.right}px, ${y}px) scaleY(${sy})`,
        };
      }
      const setParts = (tf) => Object.keys(parts).forEach((k) => { parts[k].style.transform = tf ? tf[k] : ''; });

      function openExpand(box) {
        if (expand.classList.contains('is-open')) return;
        clearTimeout(timer);
        opener = box;
        expand.classList.remove('is-open', 'is-closing');
        setParts(collapsed(box));
        expand.classList.add('is-active');
        box.classList.add('is-expanded');
        expand.setAttribute('aria-hidden', 'false');
        document.body.classList.add('has-expand');
        expand.getBoundingClientRect();   // commit the start position before animating
        expand.classList.add('is-open');
        setParts(null);
        closeBtn.focus({ preventScroll: true });
      }
      function closeExpand() {
        if (!expand.classList.contains('is-open')) return;
        expand.classList.remove('is-open');
        expand.classList.add('is-closing');
        setParts(collapsed(opener));
        timer = setTimeout(() => {
          expand.classList.remove('is-active', 'is-closing');
          opener.classList.remove('is-expanded');
          expand.setAttribute('aria-hidden', 'true');
          document.body.classList.remove('has-expand');
          opener.focus({ preventScroll: true });
        }, reduced ? 0 : 800);
      }

      document.querySelectorAll('.playground[data-expand]').forEach((box) => {
        box.addEventListener('click', (e) => { e.preventDefault(); openExpand(box); });
      });
      closeBtn.addEventListener('click', closeExpand);
      document.addEventListener('keydown', (e) => {
        if (!expand.classList.contains('is-open')) return;
        if (e.key === 'Escape') closeExpand();
        if (e.key === 'Tab') { e.preventDefault(); closeBtn.focus(); }   // only one control to keep focus on
      });

    })();
  </script>
</body>
